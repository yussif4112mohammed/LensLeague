<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/vercel_lens.jpg" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to return a
         real value. Without it those insets resolve to 0 on iPhone, and the
         bottom navigation in PhotographerShell.css - which already asks for
         them - sits under the home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="LensLeague — The world's most beautiful and intuitive photography platform. Showcasing photography as the hero." />
    <meta name="theme-color" content="#08080A" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>LensLeague — The World's Most Beautiful Photography Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Leica Aperture Edition brand fonts: Outfit, Inter, JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
